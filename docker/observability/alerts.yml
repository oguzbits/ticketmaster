# SLO alert rules, evaluated by Prometheus (local observability profile, see docs/observability.md).
# Targets: booking routes answer below 500 for 99.5 % of requests over 30 days; p95 of the hold route
# at most 500 ms, of the payment route at most 1 s. Delivery (Alertmanager, paging) is out of scope.
groups:
  - name: slo
    rules:
      - alert: BookingErrorRatioHigh
        expr: |
          sum(rate(http_server_request_duration_count{http_request_method="POST",http_route=~"/api/bookings|/api/bookings/:id/payment|/api/bookings/:id/cancel",http_response_status_code=~"5.."}[5m]))
          / sum(rate(http_server_request_duration_count{http_request_method="POST",http_route=~"/api/bookings|/api/bookings/:id/payment|/api/bookings/:id/cancel"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: More than 5 % of booking requests answer with a 5xx status
          runbook: docs/observability.md#alerts

      - alert: HoldLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{http_request_method="POST",http_route="/api/bookings"}[5m])))
          > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 latency of the hold route is above 500 ms
          runbook: docs/observability.md#alerts

      - alert: PaymentLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{http_request_method="POST",http_route="/api/bookings/:id/payment"}[5m])))
          > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 latency of the payment route is above 1 s
          runbook: docs/observability.md#alerts

  - name: worker
    rules:
      # OutboxStuck and DeadLetterQueueNotEmpty read the maximum of the last 5 minutes: a gauge whose
      # source times out is left out of a scrape, and a plain comparison would then restart `for`
      # on every gap. The alert resolves up to 5 minutes after the cause is gone.
      - alert: OutboxStuck
        expr: max_over_time(tm_outbox_oldest_age[5m]) > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: The oldest outbox row has waited more than 5 minutes
          runbook: docs/observability.md#alerts

      - alert: DeadLetterQueueNotEmpty
        expr: max_over_time(tm_queue_depth{queue="booking-events-dlq"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Messages sit in the dead-letter queue
          runbook: docs/observability.md#alerts

      # A worker gauge whose source (PostgreSQL, SQS) is down is left out of the scrape instead of
      # reported as 0, so OutboxStuck and DeadLetterQueueNotEmpty would go silent. This rule covers
      # a gauge that is gone for a whole minute while the worker itself is up; a down worker is
      # ScrapeTargetDown, a gauge that only flaps is caught by the windows above.
      - alert: GaugeSourceMissing
        expr: |
          up{job="worker"} == 1
          and on() (absent_over_time(tm_outbox_oldest_age[1m]) or absent_over_time(tm_queue_depth{queue="booking-events-dlq"}[1m]))
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The worker reports no outbox age or dead-letter depth, so those alerts are blind
          runbook: docs/observability.md#alerts

  - name: scrape
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A metrics target does not answer its scrape
          runbook: docs/observability.md#alerts

      # dns_sd_configs lists the containers Docker DNS returns, so a stopped or crash-looping API
      # container is no target at all and ScrapeTargetDown (up == 0) never sees it. The two rules
      # below watch the number of API targets that answer. The 2 is `deploy.replicas` of the api
      # service in docker-compose.yml; change both together.
      - alert: ApiAllReplicasGone
        expr: absent(up{job="api"} == 1)
        for: 1m
        labels:
          severity: page
        annotations:
          summary: No API replica answers its scrape, so the booking alerts are blind and requests fail
          runbook: docs/observability.md#alerts

      - alert: ApiReplicaMissing
        expr: count(up{job="api"} == 1) < 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Fewer API replicas answer than deploy.replicas in docker-compose.yml (2)
          runbook: docs/observability.md#alerts
