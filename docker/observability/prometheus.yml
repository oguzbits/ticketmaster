# Scrapes the metrics listener (port 9464) of the API replicas and the worker. Local observability
# profile only, see docs/observability.md.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Compose DNS returns one A record per replica, so every API replica is its own target.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9464
        refresh_interval: 10s
  - job_name: worker
    static_configs:
      - targets: ['worker:9464']
