# Single-binary Tempo for the local observability profile. The API and the worker send OTLP/HTTP
# to port 4318; Grafana queries port 3200. Traces stay in a Compose volume.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
