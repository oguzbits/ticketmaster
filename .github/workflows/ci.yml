name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: every commit there keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to commit SHAs; the tag is noted in the comment.
# pnpm/setup reads the pnpm version from package.json (packageManager)
# and the Node version from .nvmrc, then runs `pnpm install --frozen-lockfile`.
# require-lockfile makes the job fail when pnpm-lock.yaml is missing or out of date.
jobs:
  quality:
    timeout-minutes: 15
    name: Typecheck, lint, architecture, dead code, duplication, audits, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm check
      # A change to a path in docs/docs-map.json needs its document or "Docs: n/a, <reason>".
      # The first push of a branch has no earlier commit, so the whole history is checked.
      - name: Docs map
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then RANGE="$BEFORE..$HEAD"; else RANGE="$HEAD"; fi
          node scripts/audit/audit-docs-map.mjs --range "$RANGE"
      # Production dependencies only.
      - run: pnpm audit --prod --audit-level=high

  test:
    timeout-minutes: 10
    name: Unit tests (offline, no real network calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test

  test-db:
    timeout-minutes: 10
    name: Database tests (Postgres, Redis and AWS emulator services, migration drift)
    runs-on: ubuntu-latest
    # Image tags and ports match docker-compose.yml.
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
      # The image has its own health check; the service container waits for it.
      aws:
        image: floci/floci:2.4.0
        ports:
          - 45660:4566
      # The mail sink of the ticket mail specs: SMTP on 1025, REST API on 8025.
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm aws:init
      - run: pnpm aws:smoke
      # The global setup creates and migrates its own `app_test` database on the service.
      - run: pnpm test:db
      # drizzle-kit has no drift flag: generating again must not write a new migration.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain apps/api/drizzle)"

  build:
    timeout-minutes: 10
    name: Build shared, api, worker and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build

  stack:
    timeout-minutes: 15
    name: Compose stack (images build, every service healthy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up -d --build --wait --quiet-pull
      - name: The web container serves the app and proxies the API
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<app-root>'
          curl -fsS http://127.0.0.1:8080/health/live | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/health/ready | grep -q '"status":"UP"'
      - name: The worker is running and the migration completed
        run: |
          docker compose ps --status running --services | grep -qx worker
          docker compose ps --all --status exited --services | grep -qx migrate
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 100

  e2e:
    timeout-minutes: 20
    name: End-to-end tests (Playwright against the Compose stack)
    runs-on: ubuntu-latest
    # `pnpm e2e` builds and starts the stack under this project name with the e2e overrides.
    env:
      COMPOSE_PROJECT_NAME: ticketmaster-klon-e2e
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @app/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      # The script tears the stack down itself; this covers a cancelled or crashed run.
      - name: Stack down
        if: always()
        run: docker compose down --volumes --remove-orphans

  trivy:
    timeout-minutes: 10
    name: Trivy (dependencies, secrets, Dockerfile) and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trivy 0.76.0 by digest, run as a container. Fails on fixable HIGH and CRITICAL findings;
      # the SBOM lists every package.
      - name: Scan
        run: |
          docker run --rm -v "$PWD":/w -w /w aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-version-check --no-progress .
      - name: SBOM
        run: |
          docker run --rm -v "$PWD":/w -w /w aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            fs --format cyclonedx --output sbom.cdx.json --skip-version-check --no-progress .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  semgrep:
    timeout-minutes: 10
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config auto --error apps packages

  gitleaks:
    timeout-minutes: 10
    name: Gitleaks (secrets in the whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Gitleaks 8.30.1 by digest, run as a container.
      - run: |
          docker run --rm -v "$PWD":/w -w /w ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner .
