<div class="mx-auto flex min-h-dvh max-w-3xl flex-col gap-6 p-6">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <a routerLink="/" class="text-xl font-semibold">ticketmaster-klon</a>
    <nav class="flex items-center gap-4" aria-label="Main">
      <a routerLink="/events" class="underline">Events</a>
      @if (store.role() === customer) {
        <a routerLink="/bookings" class="underline">My bookings</a>
      } @else if (store.role() === organizer) {
        <a routerLink="/organizer" class="underline">Organizer</a>
      }
      @if (store.role(); as role) {
        <span class="text-text-muted">Signed in as {{ role }}</span>
        <button type="button" class="btn" (click)="auth.logout()">Log out</button>
      }
    </nav>
  </header>

  <main class="flex flex-1 flex-col gap-4">
    <router-outlet />
  </main>

  <footer class="text-sm text-text-muted">
    Unofficial demo. Not affiliated with Ticketmaster.
  </footer>
</div>
