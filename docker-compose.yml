# Local stack. `docker compose up --build` starts everything; `pnpm db:up` starts only Postgres and
# Redis for the tests. The credentials are for these local containers only.
name: ticketmaster-klon

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '54330:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    ports:
      - '63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: ask the management port (9000) through bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 3000

  web:
    build:
      context: .
      target: web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
