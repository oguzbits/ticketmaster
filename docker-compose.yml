# Local stack. `docker compose up --build` starts everything; `pnpm db:up` starts only Postgres,
# Redis and the AWS emulator (with its queues and bucket) for the tests. The credentials are for these local containers only.
name: ticketmaster-klon

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '54330:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    ports:
      - '63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local AWS emulator (SQS and S3), see docs/adr/0004-local-aws-emulator.md. Any credentials work.
  # The image brings its own health check (the emulator's readiness route). FLOCI_HOSTNAME makes
  # the queue URLs it returns resolvable inside the Compose network.
  aws:
    image: floci/floci:2.4.0
    environment:
      FLOCI_HOSTNAME: aws
    ports:
      - '45660:4566'

  # One-shot: creates the queues, the dead-letter queue and the bucket (safe to run again), then
  # exits. api and worker wait for it.
  aws-init:
    build:
      context: .
      target: tools
    command: ['node', 'scripts/aws-init.mjs']
    environment:
      AWS_ENDPOINT_URL: http://aws:4566
    depends_on:
      aws:
        condition: service_healthy

  # Mail sink for the confirmation mail: accepts every message, shows it in a UI (8025) and a REST
  # API. SMTP on 1025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./docker/keycloak/ticketmaster-realm.json:/opt/keycloak/data/import/ticketmaster-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: ask the management port (9000) through bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # One-shot: applies the migrations and the seed, then exits. api and worker wait for it.
  migrate:
    build:
      context: .
      target: api
    command: ['node', 'dist/infrastructure/database/migrate.js']
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      # Not used here, but the shared env schema requires it in production.
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # The API only serves tickets, but the tickets module builds the sender at start.
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
