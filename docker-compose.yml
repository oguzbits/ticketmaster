# Local stack. `docker compose up --build` starts everything; `pnpm db:up` starts only Postgres,
# Redis and the AWS emulator (with its queues and bucket) for the tests. The credentials are for these local containers only.
name: ticketmaster-klon

# Every service merges this and adds its limits; a rule it cannot meet is named with a reason under
# `x-hardening-exception`. apps/api/src/infrastructure/compose-hardening.spec.ts enforces it.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  read_only: true

services:
  postgres:
    <<: *hardening
    mem_limit: 512m
    cpus: 1.0
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /run/postgresql]
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '54330:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30

  # Connection pooler in transaction mode between the apps and Postgres, see
  # docs/adr/0005-pgbouncer-transaction-mode.md. The wildcard database entry (no DB_NAME) lets the
  # db specs reach `app_test` through it. migrate talks to Postgres directly.
  pgbouncer:
    <<: *hardening
    mem_limit: 64m
    cpus: 0.25
    # The entrypoint writes the config and the user list; the image runs as uid 70.
    tmpfs:
      - /etc/pgbouncer:uid=70,gid=70
      - /var/log/pgbouncer:uid=70,gid=70
      - /var/run/pgbouncer:uid=70,gid=70
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    environment:
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: app
      # Postgres 18 stores SCRAM hashes, so the pooler logs in with SCRAM too.
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # Named prepared statements survive a change of server connection (needs PgBouncer 1.21+).
      MAX_PREPARED_STATEMENTS: '200'
      # Server connections per database and user: shared by the API replicas and the worker.
      DEFAULT_POOL_SIZE: '30'
      # Client connections: 3 processes with 20 each, the 60 of the concurrency spec, headroom.
      MAX_CLIENT_CONN: '300'
    ports:
      - '64320:5432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A bare port check: pg_isready would log a failed login on the pooler every interval.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardening
    mem_limit: 128m
    cpus: 0.25
    cap_add: [SETGID, SETUID, CHOWN]
    tmpfs: [/data]
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports:
      - '63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local AWS emulator (SQS and S3), see docs/adr/0004-local-aws-emulator.md. Any credentials work.
  # The image brings its own health check (the emulator's readiness route). FLOCI_HOSTNAME makes
  # the queue URLs it returns resolvable inside the Compose network.
  aws:
    <<: *hardening
    mem_limit: 320m
    cpus: 1.0
    # The entrypoint starts as root and drops to uid 1001 with chroot --userspec.
    cap_add: [SYS_CHROOT, SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    tmpfs: [/tmp, '/app/data:uid=1001,gid=0']
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    environment:
      FLOCI_HOSTNAME: aws
    ports:
      - '45660:4566'

  # One-shot: creates the queues, the dead-letter queue and the bucket (safe to run again), then
  # exits. api and worker wait for it.
  aws-init:
    <<: *hardening
    mem_limit: 128m
    cpus: 0.25
    tmpfs: [/tmp]
    build:
      context: .
      target: tools
    command: ['node', 'scripts/aws-init.mjs']
    environment:
      AWS_ENDPOINT_URL: http://aws:4566
    depends_on:
      aws:
        condition: service_healthy

  # Mail sink for the confirmation mail: accepts every message, shows it in a UI (8025) and a REST
  # API. SMTP on 1025. Nothing leaves the machine.
  mailpit:
    <<: *hardening
    mem_limit: 64m
    cpus: 0.25
    tmpfs: [/tmp]
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    <<: *hardening
    mem_limit: 1280m
    cpus: 2.0
    tmpfs: [/tmp]
    # `start-dev` rebuilds its Quarkus runtime into /opt/keycloak at every start.
    read_only: false
    x-hardening-exception:
      read_only: start-dev writes the rebuilt Quarkus runtime under /opt/keycloak
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./docker/keycloak/ticketmaster-realm.json:/opt/keycloak/data/import/ticketmaster-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: ask the management port (9000) through bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # One-shot: applies the migrations and the seed, then exits. api and worker wait for it. It connects to Postgres directly (migrations need no pooler).
  migrate:
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    build:
      context: .
      target: api
    command: ['node', 'dist/infrastructure/database/migrate.js']
    environment:
      # The migration runs as the owner and creates the runtime role with the password of DATABASE_URL.
      MIGRATION_DATABASE_URL: postgres://app:app@postgres:5432/app
      DATABASE_URL: postgres://app_runtime:app_runtime@postgres:5432/app
      # Not used here, but the shared env schema requires it in production.
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardening
    mem_limit: 320m
    cpus: 1.0
    tmpfs: [/tmp]
    build:
      context: .
      target: api
    # Two replicas behind Caddy; no host port, so they do not collide.
    deploy:
      replicas: 2
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app_runtime:app_runtime@pgbouncer:5432/app
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Off unless started as `TRACING_ENABLED=true docker compose --profile observability up`,
      # see docs/observability.md.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://tempo:4318
      # Off unless started with METRICS_ENABLED=true (see docs/observability.md). Prometheus scrapes
      # port 9464 inside the network; it is never published to the host.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9464
      # The trace link of a simulator run, as the admin's browser reaches Grafana; shown only when
      # tracing is on.
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      # The API only serves tickets, but the tickets module builds the sender at start.
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully

  worker:
    <<: *hardening
    mem_limit: 256m
    cpus: 2.0
    tmpfs: [/tmp]
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://app_runtime:app_runtime@pgbouncer:5432/app
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Off unless started as `TRACING_ENABLED=true docker compose --profile observability up`,
      # see docs/observability.md.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://tempo:4318
      # Off unless started with METRICS_ENABLED=true (see docs/observability.md). Prometheus scrapes
      # port 9464 inside the network; it is never published to the host.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9464
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  web:
    <<: *hardening
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/tmp, /config, /data]
    build:
      context: .
      target: web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

  # Observability profile (local only): `docker compose --profile observability up`, see
  # docs/observability.md and docs/adr/0007-tracing-with-opentelemetry.md. The ports are bound to
  # localhost; none of the five services starts without the profile.
  tempo:
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    profiles: [observability]
    command: ['-target=all', '-config.file=/etc/tempo.yaml']
    ports:
      - '127.0.0.1:3200:3200'
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      # The image has no shell or curl; the binary checks its own /ready.
      test: ['CMD', '/tempo', '-health']
      interval: 5s
      timeout: 3s
      retries: 30

  # The image has no shell either, so there is no health check; Alloy retries its pushes until Loki is up.
  loki:
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    profiles: [observability]
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  # Reads the container logs through the Docker socket and ships them to Loki. The socket gives
  # read access to every container on the host: see the risk note in docs/observability.md.
  alloy:
    <<: *hardening
    mem_limit: 320m
    cpus: 0.5
    # Runs as root on a volume that an earlier run may have left with another owner.
    cap_add: [DAC_OVERRIDE]
    tmpfs: [/tmp]
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    profiles: [observability]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    healthcheck:
      # The image has no curl or wget, and its /bin/sh (dash) has no /dev/tcp: ask through bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 30

  # Scrapes the API replicas and the worker (see docker/observability/prometheus.yml), evaluates
  # docker/observability/alerts.yml; keeps two days. Needs METRICS_ENABLED=true on api and worker, else every target is down.
  prometheus:
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    <<: *hardening
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
