# Local stack. `docker compose up --build` starts everything; `pnpm db:up` starts only Postgres,
# Redis and the AWS emulator (with its queues and bucket) for the tests. The credentials are for these local containers only.
name: ticketmaster-klon

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '54330:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30

  # Connection pooler in transaction mode between the apps and Postgres, see
  # docs/adr/0005-pgbouncer-transaction-mode.md. The wildcard database entry (no DB_NAME) lets the
  # db specs reach `app_test` through it. migrate talks to Postgres directly.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: app
      # Postgres 18 stores SCRAM hashes, so the pooler logs in with SCRAM too.
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # Named prepared statements survive a change of server connection (needs PgBouncer 1.21+).
      MAX_PREPARED_STATEMENTS: '200'
      # Server connections per database and user: shared by the API replicas and the worker.
      DEFAULT_POOL_SIZE: '30'
      # Client connections: 3 processes with 20 each, the 60 of the concurrency spec, headroom.
      MAX_CLIENT_CONN: '300'
    ports:
      - '64320:5432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A bare port check: pg_isready would log a failed login on the pooler every interval.
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    ports:
      - '63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local AWS emulator (SQS and S3), see docs/adr/0004-local-aws-emulator.md. Any credentials work.
  # The image brings its own health check (the emulator's readiness route). FLOCI_HOSTNAME makes
  # the queue URLs it returns resolvable inside the Compose network.
  aws:
    image: floci/floci:2.4.0
    environment:
      FLOCI_HOSTNAME: aws
    ports:
      - '45660:4566'

  # One-shot: creates the queues, the dead-letter queue and the bucket (safe to run again), then
  # exits. api and worker wait for it.
  aws-init:
    build:
      context: .
      target: tools
    command: ['node', 'scripts/aws-init.mjs']
    environment:
      AWS_ENDPOINT_URL: http://aws:4566
    depends_on:
      aws:
        condition: service_healthy

  # Mail sink for the confirmation mail: accepts every message, shows it in a UI (8025) and a REST
  # API. SMTP on 1025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./docker/keycloak/ticketmaster-realm.json:/opt/keycloak/data/import/ticketmaster-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: ask the management port (9000) through bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # One-shot: applies the migrations and the seed, then exits. api and worker wait for it. It connects to Postgres directly (migrations need no pooler).
  migrate:
    build:
      context: .
      target: api
    command: ['node', 'dist/infrastructure/database/migrate.js']
    environment:
      # The migration runs as the owner and creates the runtime role with the password of DATABASE_URL.
      MIGRATION_DATABASE_URL: postgres://app:app@postgres:5432/app
      DATABASE_URL: postgres://app_runtime:app_runtime@postgres:5432/app
      # Not used here, but the shared env schema requires it in production.
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    # Two replicas behind Caddy; no host port, so they do not collide.
    deploy:
      replicas: 2
    environment:
      PORT: 3000
      DATABASE_URL: postgres://app_runtime:app_runtime@pgbouncer:5432/app
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Off unless started as `TRACING_ENABLED=true docker compose --profile observability up`,
      # see docs/observability.md.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://tempo:4318
      # Off unless started with METRICS_ENABLED=true (see docs/observability.md). Prometheus scrapes
      # port 9464 inside the network; it is never published to the host.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9464
      # The trace link of a simulator run, as the admin's browser reaches Grafana; shown only when
      # tracing is on.
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      # The API only serves tickets, but the tickets module builds the sender at start.
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://app_runtime:app_runtime@pgbouncer:5432/app
      REDIS_URL: redis://redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_DEMO_CLIENT_SECRET: local-demo-client-secret
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Off unless started as `TRACING_ENABLED=true docker compose --profile observability up`,
      # see docs/observability.md.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://tempo:4318
      # Off unless started with METRICS_ENABLED=true (see docs/observability.md). Prometheus scrapes
      # port 9464 inside the network; it is never published to the host.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9464
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

  # Observability profile (local only): `docker compose --profile observability up`, see
  # docs/observability.md and docs/adr/0007-tracing-with-opentelemetry.md. The ports are bound to
  # localhost; none of the five services starts without the profile.
  tempo:
    image: grafana/tempo:3.1.1
    profiles: [observability]
    command: ['-target=all', '-config.file=/etc/tempo.yaml']
    ports:
      - '127.0.0.1:3200:3200'
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      # The image has no shell or curl; the binary checks its own /ready.
      test: ['CMD', '/tempo', '-health']
      interval: 5s
      timeout: 3s
      retries: 30

  # The image has no shell either, so there is no health check; Alloy retries its pushes until Loki is up.
  loki:
    image: grafana/loki:3.7.10
    profiles: [observability]
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  # Reads the container logs through the Docker socket and ships them to Loki. The socket gives
  # read access to every container on the host: see the risk note in docs/observability.md.
  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [observability]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    healthcheck:
      # The image has no curl or wget, and its /bin/sh (dash) has no /dev/tcp: ask through bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf 'GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 30

  # Scrapes the API replicas and the worker (see docker/observability/prometheus.yml), evaluates
  # docker/observability/alerts.yml; keeps two days. Needs METRICS_ENABLED=true on api and worker, else every target is down.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
